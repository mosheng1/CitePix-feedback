name: ❓ 问题咨询
description: 咨询 CitePix 的使用、配置或兼容性问题
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提问！🤔

        提问前可以先查看 README 和已有 Issues；需要交流想法时，也可以前往 Discussions 或 QQ 社区。

  - type: dropdown
    id: question-type
    attributes:
      label: 问题类型
      description: 选择最符合你问题的类型
      options:
        - 使用方法
        - 配置设置
        - 故障排查
        - 功能咨询
        - 兼容性问题
        - 其他问题
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: 问题描述
      description: 详细描述你的问题，包括具体场景和想要达到的效果
      placeholder: 请清晰地描述你的问题……
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: 已尝试的方法
      description: 你已经尝试过什么方法？结果如何？
      placeholder: 描述你已经尝试的操作，以及出现的结果

  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 你正在使用的 CitePix 版本号
      placeholder: 例如：v0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      description: 你使用的 Windows 版本
      options:
        - Windows 11
        - Windows 10
        - Windows 其他版本
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 相关截图
      description: 如果适用，拖拽截图到这里帮助说明问题
      placeholder: 请确认图片中不包含敏感信息

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 添加任何其他有助于回答问题的信息
      placeholder: 例如：显示器数量、缩放比例、相关设置等

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      description: 请确认以下内容
      options:
        - label: 我已经查看过 README 和已有 Issues
          required: true
        - label: 我已提供 CitePix 版本和 Windows 版本
          required: true
