name: 同步 GitHub Releases 到 Gitee
run-name: 同步 Gitee（${{ github.event.release.tag_name || '全部版本' }} / ${{ github.event.action || '手动' }}）

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
    inputs:
      reorder:
        description: '重建 Gitee Releases 顺序；会删除并重新创建所有 Gitee Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sync-gitee-releases
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'mosheng1/CitePix-feedback' && (github.event_name != 'release' || !github.event.release.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITEE_REPO: mk-mo-sheng/CitePix-feedback
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      REORDER_RELEASES: ${{ inputs.reorder || false }}
      RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
      RELEASE_ACTION: ${{ github.event.action || '' }}

    steps:
      - name: 检出完整标签历史
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 校验 Gitee 令牌
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GITEE_TOKEN}" ]]; then
            echo '未配置 GITEE_TOKEN，请在仓库 Settings > Secrets and variables > Actions 中添加 Gitee 私人令牌。' >&2
            exit 1
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --get --data-urlencode "access_token=${GITEE_TOKEN}" \
            'https://gitee.com/api/v5/user')"
          if [[ "${status}" != '200' ]]; then
            echo "Gitee 令牌校验失败，HTTP 状态码：${status}" >&2
            exit 1
          fi

      - name: 推送发布标签到 Gitee
        shell: bash
        run: |
          set -euo pipefail
          remote="https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          push_tag() {
            local tag="$1"
            local reference="refs/tags/${tag}"
            local local_object remote_object
            local_object="$(git rev-parse "${reference}")"
            remote_object="$(git ls-remote --refs "${remote}" "${reference}" | awk '{print $1}')"
            if [[ -n "${remote_object}" ]]; then
              if [[ "${remote_object}" != "${local_object}" ]]; then
                echo "Gitee 标签指向不同对象，已停止同步：${tag}" >&2
                return 1
              fi
              echo "Gitee 已存在相同标签，跳过：${tag}"
              return 0
            fi
            git push --quiet "${remote}" "${reference}:${reference}"
          }
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            while IFS= read -r tag; do
              push_tag "${tag}"
            done < <(git tag --list 'v*')
          elif [[ "${RELEASE_ACTION}" != 'deleted' ]]; then
            push_tag "${RELEASE_TAG}"
          fi

      - name: 同步发布说明和附件
        shell: bash
        run: python3 .github/scripts/sync-gitee-releases.py
